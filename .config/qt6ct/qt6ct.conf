# Thème Qt6 minimal : palette Gruvbrutal (voir colors/Gruvbrutal.conf,
# généré par theme/generate.sh) + style Fusion (intégré à Qt, pas besoin
# de Kvantum). Ne concerne que les rares apps Qt6 (ex. polkit-kde-agent).
[Appearance]
color_scheme_path=$HOME/.config/qt6ct/colors/Gruvbrutal.conf
custom_palette=true
icon_theme=Adwaita
standard_dialogs=default
style=Fusion

[Fonts]
fixed="JetBrainsMono Nerd Font Mono,11,-1,5,50,0,0,0,0,0,Regular"
general="JetBrainsMono Nerd Font Mono,11,-1,5,50,0,0,0,0,0,Regular"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[Troubleshooting]
force_raster_widgets=1
