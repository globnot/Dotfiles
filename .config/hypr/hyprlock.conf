# Palette DA : ces lignes sont gérées par theme/generate.sh (voir
# theme/palette.sh) — ne pas éditer directement, ce serait écrasé.
$bg0 = fbf1c7
$bg1 = ebdbb2
$fg0 = 3c3836
$fg1 = 504945
$accent = e91e8c

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba($bg0ff)
}

input-field {
    monitor =
    size = 250, 60
    rounding = 3
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.3
    dots_rounding = 1
    outer_color = rgba($accentff)
    inner_color = rgba($bg1ff)
    font_color = rgba($fg0ff)
    fade_on_empty = false
    placeholder_text = <span> </span>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba($fg0ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d %B')"
    color = rgba($fg1ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 90
    halign = center
    valign = center
}
