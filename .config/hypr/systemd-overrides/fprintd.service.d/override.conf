# Empêche fprintd de s'arrêter après quelques secondes d'inactivité.
# Par défaut (activation D-Bus à la demande), il redémarre à froid à
# chaque tentative de déverrouillage, ce qui force un reset USB du
# capteur (vu dans les logs : "usb 1-5: reset full-speed USB device") —
# le capteur n'est pas prêt à temps, d'où un déverrouillage par empreinte
# fiable juste après boot (fprintd encore chaud) mais capricieux ensuite.
# -t/--no-timeout le garde actif en permanence une fois démarré. En plus
# de ça, hyprland.lua le démarre explicitement au lancement de la
# session pour qu'il soit déjà chaud dès la première tentative de
# verrouillage, pas seulement après.
[Service]
ExecStart=
ExecStart=/usr/lib/fprintd -t
