# Config reflector suivie par Dotfiles (voir reflector/setup.sh), déployée
# dans /etc/xdg/reflector/reflector.conf. Sert à régénérer automatiquement
# /etc/pacman.d/mirrorlist (via reflector.timer) avec des miroirs réellement
# vivants : la liste par défaut d'Arch contenait des miroirs morts
# (elda.asgardius.company, mirror.cosmiclinux.com) qui cassaient
# régulièrement les sync pacman (404), obligeant un -Syyu forcé à chaque
# fois au lieu d'un simple -Syu.
--save /etc/pacman.d/mirrorlist
--protocol https
--country France
--latest 10
--sort rate
