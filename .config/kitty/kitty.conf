font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

cursor_shape     beam

# Gruvbox Light. background/foreground/accent/tabs viennent de
# theme-colors.conf (généré par theme/generate.sh, voir theme/palette.sh) ;
# le reste de la palette ANSI ci-dessous est fixe, pas généré.
include theme-colors.conf

color8  #928374
color1  #cc241d
color2  #98971a
color10 #79740e
color3  #d79921
color11 #b57614
color4  #458588
color12 #076678
color5  #b16286
color13 #8f3f71
color6  #689d6a
color14 #427b58
color7  #7c6f64

background_opacity 1.0

# Onglets
tab_bar_edge             top
tab_bar_style             powerline
tab_powerline_style       slanted
inactive_tab_foreground    #7c6f64
