# Palette DA : ces lignes sont gérées par theme/generate.sh (voir
# theme/palette.sh) — ne pas éditer directement, ce serait écrasé.
$bg0 = fbf1c7
$bg1 = ebdbb2
$fg0 = 3c3836
$fg1 = 504945
$accent = e91e8c
$fauxnoir = 1d2021

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba($bg0ff)
}

# Ombre dure décalée façon neobrutalism (comme les boutons de wlogout,
# box-shadow 5px 5px @fauxnoir) : une forme pleine légèrement décalée en
# bas-droite, dessinée avant le champ pour rester dessous.
shape {
    monitor =
    size = 250, 60
    rounding = 4
    color = rgba($fauxnoirff)
    border_size = 0
    position = 5, -25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 60
    rounding = 4
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_rounding = 1
    outer_color = rgba($fauxnoirff)
    inner_color = rgba($bg1ff)
    font_color = rgba($fg0ff)
    fade_on_empty = false
    placeholder_text = <span> </span>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba($fg0ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d %B')"
    color = rgba($fg1ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 90
    halign = center
    valign = center
}
